services:
  db:
    image: postgres:16-alpine
    container_name: aquaflash-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro,Z
      - ./backend/src/database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro,Z
    networks:
      - aquaflash_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: aquaflash-backend
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aquaflash_network

  frontend:
    build: ./frontend
    container_name: aquaflash-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,Z
    networks:
      - aquaflash_network

volumes:
  postgres_data:

networks:
  aquaflash_network:
    driver: bridge
