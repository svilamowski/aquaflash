<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlash - Clientes</title>
  <link rel="icon" href="../../public/logo2.png">
  <link rel="stylesheet" href="../../components/base.css">
  <link rel="stylesheet" href="../../components/navbar.css">
  <link rel="stylesheet" href="index.css">
  <script src="../../components/theme.js"></script>
</head>

<body>
  <div id="navbar"></div>

  <main class="page-content clientes-page">
    <header class="clientes-header">
      <h1>Clientes</h1>
      <div class="clientes-header-actions">
        <input type="search" id="busqueda" class="busqueda-input"
          placeholder="Buscar por nombre o dirección...">
        <button type="button" class="btn-nuevo" id="btn-nuevo">+ Nuevo Cliente</button>
      </div>
    </header>

    <section class="filtros" id="filtros">
      <button type="button" class="filtro-pill active" data-filtro="todos">Todos</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Lunes">Lun</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Martes">Mar</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Miércoles">Mié</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Jueves">Jue</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Viernes">Vie</button>
      <button type="button" class="filtro-pill" data-filtro="dia" data-dia="Sábados">Sáb</button>
      <select id="filtro-deuda" class="filtro-select">
        <option value="">Deuda</option>
        <option value="con-deuda">Con deuda</option>
        <option value="sin-deuda">Sin deuda</option>
      </select>
      <select id="filtro-repartidor" class="filtro-select">
        <option value="">Repartidor</option>
      </select>
    </section>

    <section id="lista-clientes" class="lista-clientes"></section>
    <p id="mensaje-estado" class="mensaje-estado" hidden></p>
  </main>

  <div id="modal-nuevo" class="modal" hidden>
    <div class="modal__fondo" data-cerrar></div>
    <div class="modal__caja">
      <h2 id="modal-titulo">Nuevo cliente</h2>
      <form id="form-nuevo" class="form-nuevo">
        <label>
          Nombre
          <input type="text" name="nombre" required placeholder="Ej: Ana García">
        </label>
        <label>
          Dirección
          <input type="text" name="direccion" required placeholder="Ej: Av. Libertador 1234">
        </label>
        <label>
          Teléfono
          <input type="tel" name="telefono" required placeholder="Ej: 1144556677">
        </label>
        <label>
          Repartidor
          <select name="repartidor_id" id="form-repartidor" required>
            <option value="">Seleccionar...</option>
          </select>
        </label>

        <div class="form-grupo">
          <span class="form-grupo__label">Días de visita</span>
          <div class="dia-botones" id="dias-visita">
            <button type="button" class="dia-btn" data-dia="Lunes">Lun</button>
            <button type="button" class="dia-btn" data-dia="Martes">Mar</button>
            <button type="button" class="dia-btn" data-dia="Miércoles">Mié</button>
            <button type="button" class="dia-btn" data-dia="Jueves">Jue</button>
            <button type="button" class="dia-btn" data-dia="Viernes">Vie</button>
            <button type="button" class="dia-btn" data-dia="Sábados">Sáb</button>
          </div>
        </div>

        <div class="form-grupo">
          <span class="form-grupo__label">¿Tiene dispenser?</span>
          <div class="toggle-grupo" id="dispenser-toggle">
            <button type="button" class="toggle-btn active" data-dispenser="no">No</button>
            <button type="button" class="toggle-btn" data-dispenser="si">Sí</button>
          </div>
        </div>

        <p id="form-error" class="form-error" hidden></p>
        <div class="modal__acciones">
          <button type="button" class="btn-cancelar" data-cerrar>Cancelar</button>
          <button type="submit" class="btn-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <template id="tpl-cliente">
    <article class="tarjeta-cliente">
      <div class="tarjeta-cliente__header">
        <a class="tarjeta-cliente__nombre tarjeta-cliente__nombre-link" href="#"></a>
        <span class="tarjeta-cliente__deuda"></span>
      </div>
      <div class="tarjeta-cliente__info">
        <p class="tarjeta-cliente__direccion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>
          </svg>
          <span class="tarjeta-cliente__direccion-texto"></span>
        </p>
        <div class="tarjeta-cliente__fechas">
          <span class="tarjeta-cliente__pago"></span>
          <span class="tarjeta-cliente__compra"></span>
        </div>
      </div>
      <div class="tarjeta-cliente__stock">
        <p class="tarjeta-cliente__stock-titulo">Stock en casa:</p>
        <div class="tarjeta-cliente__stock-contenido"></div>
      </div>
      <div class="tarjeta-cliente__acciones">
        <a class="accion-btn accion-maps" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span>Maps</span>
        </a>
        <a class="accion-btn accion-wapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-1.2 4.3 8.5 8.5 0 0 1-7.3 4.2 8.4 8.4 0 0 1-3.8-.9L3 20l1.9-5.5a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.2-7.3A8.4 8.4 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
          <span>WhatsApp</span>
        </a>
        <button type="button" class="accion-btn" data-accion="no-compra">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>
          <span>No Compra</span>
        </button>
        <button type="button" class="accion-btn" data-accion="editar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          <span>Editar</span>
        </button>
        <button type="button" class="accion-btn accion-btn--peligro" data-accion="baja">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
          <span>Baja</span>
        </button>
      </div>
    </article>
  </template>

  <script src="../../components/navbar.js"></script>
  <script src="index.js"></script>
</body>

</html>
