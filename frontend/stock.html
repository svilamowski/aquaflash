<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlash - Control de Stock</title>
  <link rel="icon" href="./public/logo2.png">
  <link rel="stylesheet" href="./components/base.css">
  <link rel="stylesheet" href="./components/navbar.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="stock.css">
  <script src="./components/theme.js"></script>
</head>

<body>
  <div id="navbar"></div>

  <main class="page-content stock-page">
    <header class="stock-header">
      <h1>
        Control de Stock
      </h1>
      <button type="button" class="btn-nuevo-producto" id="btn-nuevo-producto">+ Nuevo Producto</button>
    </header>

    <section class="ajuste-panel">
      <h2 class="ajuste-panel__titulo">Ajuste Manual en Fábrica</h2>
      <form id="form-ajuste" class="ajuste-form">
        <label class="ajuste-form__campo ajuste-form__campo--producto">
          <span>Producto</span>
          <select id="ajuste-producto" required>
            <option value="">Seleccionar producto...</option>
          </select>
        </label>
        <label class="ajuste-form__campo ajuste-form__campo--cantidad">
          <span>Cantidad</span>
          <input type="number" id="ajuste-cantidad" min="1" value="1" required>
        </label>
        <div class="ajuste-form__acciones">
          <button type="button" class="btn-comprar" id="btn-comprar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 5v14"/><path d="M5 12h14"/>
            </svg>
            Comprar
          </button>
          <button type="button" class="btn-descartar" id="btn-descartar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14"/>
            </svg>
            Descartar
          </button>
        </div>
      </form>
      <p id="ajuste-error" class="ajuste-error" hidden></p>
    </section>

    <section id="lista-productos" class="lista-productos"></section>
    <p id="mensaje-estado" class="mensaje-estado" hidden></p>
  </main>

  <div id="modal-producto" class="modal" hidden>
    <div class="modal__fondo" data-cerrar></div>
    <div class="modal__caja">
      <h2>Nuevo producto</h2>
      <form id="form-producto" class="form-nuevo">
        <label>
          Nombre
          <input type="text" name="nombre" required placeholder="Ej: Bidón 12L">
        </label>
        <label>
          Cantidad mínima
          <input type="number" name="cantidad_minima_fabrica" min="0" required placeholder="Ej: 200">
        </label>
        <label>
          Cantidad inicial en fábrica
          <input type="number" name="cantidad" min="0" required placeholder="Ej: 500">
        </label>
        <label>
          Precio
          <input type="number" name="precio" min="0" step="0.01" required placeholder="Ej: 2500">
        </label>
        <p id="form-error" class="form-error" hidden></p>
        <div class="modal__acciones">
          <button type="button" class="btn-cancelar" data-cerrar>Cancelar</button>
          <button type="submit" class="btn-guardar-producto">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <template id="tpl-producto">
    <article class="producto-card">
      <h3 class="producto-card__nombre"></h3>
      <div class="producto-card__total">
        <span class="producto-card__total-label">STOCK TOTAL DEL SISTEMA</span>
        <span class="producto-card__total-numero"></span>
        <span class="producto-card__total-sub">Fábrica + Casas</span>
      </div>
      <div class="producto-card__detalle">
        <div class="producto-card__bloque">
          <span class="producto-card__bloque-titulo">EN FÁBRICA</span>
          <span class="producto-card__bloque-numero producto-card__fabrica"></span>
          <span class="producto-card__min">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>
            </svg>
            Min: <span class="producto-card__min-valor"></span>
          </span>
        </div>
        <div class="producto-card__bloque">
          <span class="producto-card__bloque-titulo">EN CASAS</span>
          <span class="producto-card__bloque-numero producto-card__casas"></span>
          <span class="producto-card__info">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>
            </svg>
          </span>
        </div>
      </div>
    </article>
  </template>

  <script src="./components/navbar.js"></script>
  <script src="stock.js"></script>
</body>

</html>
